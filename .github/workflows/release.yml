# 打 tag 出签名 APK，传到 Release 页。
#
# 从 751K/holland2stay-monitor 的 build.yml 搬过来（那个文件同时还打 macOS 的
# .dmg 和 Windows 的 .exe，那两个 job 留在后端仓库）。
#
# 只出 APK。AAB 只有 Google Play 上架才用得上，而上架计划已放弃（2026-08-03）
# ——分发渠道就是 Release 页直接下载 APK。若将来改主意，加回
# `./gradlew :app:bundleRelease` 和一个上传 app-release.aab 的步骤即可。
name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # 经 env 传入避免 GitHub Actions 表达式多行替换被 shell 拆行；
          # tr -d 去掉 base64 的换行/回车（wrap 或 CRLF 会让 base64 -d 报 invalid input）
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n' | base64 -d > app/google-services.json
          test -s app/google-services.json \
            || { echo "::error::google-services.json 解码后为空——检查 GOOGLE_SERVICES_JSON_BASE64 secret"; exit 1; }
          python3 -c "import json,sys; json.load(open('app/google-services.json'))" \
            || { echo "::error::解码出的不是合法 JSON——secret 内容可能不是 base64 或被截断"; exit 1; }

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not configured; skipping signed Android APK."
            exit 0
          fi
          # 放仓库根。app/build.gradle.kts 里的 file(releaseStoreFile) 是相对
          # **模块目录** app/ 解析的，所以 RELEASE_STORE_FILE 仍然写 ../sign.p12
          # ——拆仓后模块和密钥一起平移了，这个相对关系没变。
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > sign.p12
          test -s sign.p12 \
            || { echo "::error::keystore 解码后为空——检查 ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "ANDROID_SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/') && env.ANDROID_SIGNING_READY == 'true'
        env:
          RELEASE_STORE_FILE: ../sign.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || '' }}
        run: ./gradlew :app:assembleRelease

      # 签名要当场核对。等用户装不上再回头查，一轮就是一次发版。
      - name: Verify the APK is signed
        if: startsWith(github.ref, 'refs/tags/') && env.ANDROID_SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || { echo "::error::APK 不存在或为空"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/') && env.ANDROID_SIGNING_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk

      - name: Build debug APK (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          MAPS_API_KEY: ''
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
